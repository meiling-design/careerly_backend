# ── Railway Deployment Config ─────────────────────────────────────
# Deploy: npx railway up
# Or connect GitHub repo to Railway for auto-deploy.

[build]
  builder = "nixpacks"
  buildCommand = "pip install -r requirements.txt && playwright install chromium --with-deps 2>/dev/null || true"

[deploy]
  startCommand = "uvicorn app.api.server:app --host 0.0.0.0 --port $PORT"
  healthcheckPath = "/health"
  healthcheckTimeout = 30

[service]
  port = 8000
