# ── Railway Deployment Config ─────────────────────────────────────
# Deploy: npx railway up
# Or connect GitHub repo to Railway for auto-deploy.

[build]
  builder = "DOCKERFILE"

[deploy]
  startCommand = "/bin/sh -c 'uvicorn app.api.server:app --host 0.0.0.0 --port $PORT'"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
